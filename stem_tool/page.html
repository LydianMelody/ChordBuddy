<!doctype html>
<html lang="en" data-theme="plum" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Replace a Stem</title>
<!-- Chord Buddy's own look, read from the app's files as they are (see window.py): its fonts, its three color themes and its dark scheme. -->
<link rel="stylesheet" href="/web/fonts/fonts.css">
<link rel="stylesheet" href="/web/press-room.base.css">
<link rel="stylesheet" href="/web/dark.css">
<style>
  /* This page's own layout. Colors and fonts are the app's tokens (--ink, --page, --desk, --a1 ...); the fallbacks only matter if its files are missing. */
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;gap:10px;padding:12px;box-sizing:border-box;background:var(--desk,#ece5ea);color:var(--ink,#231a2c);
       font:500 14px/1.4 var(--g,"Segoe UI",system-ui,sans-serif);overflow:auto}
  .card{background:var(--page,#fcf8f4);border:var(--bd,2.5px) solid var(--ink,#231a2c);border-radius:14px;box-shadow:var(--sh,4px) var(--sh,4px) 0 var(--ink,#231a2c)}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 12px}
  h1{margin:0 6px 0 0;font-size:18px;font-weight:800;white-space:nowrap}
  select,.pick,input[type=text]{font:inherit;color:inherit;background:var(--page,#fff);border:2px solid var(--ink,#231a2c);border-radius:10px;padding:6px 8px;min-width:0}
  #song{flex:1 1 220px;max-width:460px}
  #role{flex:0 1 150px}
  #file{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 120px}
  .btn{white-space:nowrap}
  .btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
  .btn.on{background:var(--ink,#231a2c);color:var(--page,#fff)}
  .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .seg{display:inline-flex;border:var(--bd,2.5px) solid var(--ink,#231a2c);border-radius:12px;overflow:hidden;box-shadow:3px 3px 0 var(--ink,#231a2c)}
  .seg button{font:inherit;font-weight:800;border:0;background:var(--page,#fff);color:inherit;padding:7px 11px;cursor:pointer;white-space:nowrap}
  .seg button+button{border-left:2px solid var(--ink,#231a2c)}
  .seg button.on{background:var(--ink,#231a2c);color:var(--page,#fff)}
  .cap{font:700 11px var(--m,monospace);letter-spacing:.06em;text-transform:uppercase;color:var(--soft,#625869);white-space:nowrap}
  .grow{flex:1 1 auto}
  /* the timeline takes whatever height the window has left */
  /* it never squeezes below what its controls need: a window too short for everything scrolls instead of hiding buttons under one another */
  #stage{flex:1 0 auto;display:flex;flex-direction:column}
  #view{flex:1 1 150px;min-height:150px;position:relative;margin:0 12px;border:2px solid var(--ink,#231a2c);border-radius:10px;overflow:hidden;background:var(--desk,#ece5ea);touch-action:none}
  #canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--soft,#625869);font-weight:600}
  #scroll{margin:6px 12px 0;accent-color:var(--ink,#231a2c)}
  input[type=range]{min-width:0}
  #volume{flex:0 1 130px;accent-color:var(--a1,#eb496f)}
  #where{flex:1 1 200px;min-width:0;text-align:center;font-weight:700}
  #where small{display:block;font-weight:600;color:var(--soft,#625869)}
  .tag{display:inline-block;padding:1px 9px;border:2px solid var(--ink,#231a2c);border-radius:999px;font:700 12px var(--g,sans-serif);background:var(--tint,#e2d8e0);white-space:nowrap}
  .tag.good{background:var(--a3,#22a598);color:var(--onA3,#231a2c)}
  .tag.warn{background:var(--hl,#ffcf5c);color:#231a2c}
  #bottom{display:flex;flex-wrap:wrap;gap:10px}
  #levelcard{flex:3 1 360px;min-width:0}
  #keycard,#flagcard{flex:1 1 100%;min-width:0}
  #flagsong{flex:1 1 200px;max-width:340px}
  #flagperf{flex:1 1 160px;max-width:260px}
  #flagpreview{flex:1 1 240px;min-width:0;font-weight:600}
  #flagnamewrap{display:inline-flex;align-items:center;gap:6px;font-weight:600;flex:0 1 230px;min-width:0}
  #flagname{flex:1 1 auto;min-width:6em;width:100%}
  #keyamount{font-weight:800;min-width:9.5em;text-align:center}
  #keypreview{flex:1 1 220px;min-width:0;font-weight:600}
  #keypreview b{font-weight:800}
  #keywarn{flex:1 1 100%;margin:0;font-size:13px;color:var(--soft,#625869)}
  #keywarn:empty{display:none}
  .check{display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .check.off{opacity:.5}
  #actioncard{flex:2 1 300px;min-width:0;justify-content:flex-end}
  #trim{flex:1 1 140px;accent-color:var(--a2,#4a2f86)}
  #leveltext{font-weight:700;white-space:nowrap}
  #notes{flex:1 1 100%;margin:0;color:var(--soft,#625869);font-size:13px}
  #notes:empty{display:none}
  details{padding:6px 12px}
  summary{cursor:pointer;font-weight:700}
  #log{margin:6px 0 2px;max-height:90px;overflow:auto;font-size:13px;color:var(--soft,#625869)}
  #log p{margin:0 0 4px}
  #log p:last-child{color:var(--ink,#231a2c);font-weight:600}
  #last{font-weight:600;color:var(--soft,#625869);margin-left:8px}
  #busy{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:9;padding:5px 16px;border:var(--bd,2.5px) solid var(--ink,#231a2c);border-radius:999px;background:var(--hl,#ffcf5c);color:#231a2c;font-weight:800;box-shadow:3px 3px 0 var(--ink,#231a2c)}
  [hidden]{display:none!important}
  header,#bottom,details{flex:none}
  @media (max-height:640px){details{display:none}h1{font-size:16px}body{gap:8px;padding:8px}.bar{padding:6px 10px;gap:6px 8px}}
  @media (max-width:760px){.cap.wide{display:none}}
</style>
</head>
<body>
  <header class="card bar">
    <h1>Replace stem</h1>
    <select id="song" aria-label="Song" title="The song whose stem you want to replace. Only songs with split stems are listed."></select>
    <select id="role" aria-label="Stem to replace" title="Which stem to replace. Vocals is the usual one."></select>
    <button id="choose" type="button" class="btn hot" title="Pick the audio file to use in place of this stem: WAV, FLAC, MP3 or M4A">Choose audio</button>
    <span id="file" title="">No file chosen</span>
  </header>

  <section id="stage" class="card">
    <div class="bar">
      <button id="play" type="button" class="btn hot" title="Play from the gold line (Space). Click anywhere on the bars to move the line."></button>
      <div class="seg" role="group" aria-label="What to hear">
        <button type="button" data-hear="new" class="on" title="Hear the song with the replacement in place of the stem it replaces">Updated mix</button>
        <button type="button" data-hear="now" title="Hear the song as it is in your library right now, before any replacement">Current mix</button>
        <button type="button" data-hear="solo" title="Hear only the replacement, at the level it will have in the song">New stem solo</button>
      </div>
      <button id="loop" type="button" class="btn" aria-pressed="false" title="Go round and round a few bars from the gold line (L), so you can slide the replacement until it sits right"></button>
      <select id="loopbars" class="pick" aria-label="How many bars to loop" title="How many bars the loop goes round">
        <option value="1">1 bar</option><option value="2">2 bars</option><option value="4" selected>4 bars</option><option value="8">8 bars</option>
      </select>
      <span class="grow"></span>
      <span class="cap wide">Volume</span>
      <input id="volume" type="range" min="0" max="100" step="1" aria-label="Preview volume" title="How loud the preview plays. It starts quiet on purpose.">
      <button id="snap" type="button" class="btn sq on" aria-pressed="true" title="Snap. On: dragging moves the replacement a whole beat at a time, and the gold line lands on beats. Off: it moves freely."></button>
      <button id="zoomout" type="button" class="btn sq" title="Zoom out, to see more of the song (Ctrl+wheel)"></button>
      <button id="zoomin" type="button" class="btn sq" title="Zoom in, to line it up more finely (Ctrl+wheel)"></button>
      <button id="fit" type="button" class="btn" title="Zoom out to show the whole song at once">Full song</button>
    </div>
    <div id="view">
      <canvas id="canvas" title="Drag the replacement (the lower lane) left or right to line it up with the song. Click the bars to move the gold line." aria-label="The song’s bars, with the stem as it is now on top and the replacement underneath. Drag the replacement left or right to line it up."></canvas>
      <div id="empty">Choose a song, then Choose audio. The replacement appears here on the song’s bars, and you slide it into place.</div>
    </div>
    <input id="scroll" type="range" min="0" max="1000" value="0" aria-label="Scroll along the song" title="Scroll along the song (or turn the mouse wheel over the bars)">
    <div class="bar">
      <button type="button" class="btn" data-move="-bar" title="Move the replacement one whole bar earlier (Ctrl+Left), for when it is a bar out">◀ Bar</button>
      <button type="button" class="btn" data-move="-beat" title="Move the replacement one beat earlier (Shift+Left), for when the phrases land a beat apart">◀ Beat</button>
      <button type="button" class="btn" data-move="-nudge" title="Move the replacement a hundredth of a second earlier (Left arrow), for getting the consonants to land together">◀ Nudge</button>
      <div id="where"></div>
      <button type="button" class="btn" data-move="+nudge" title="Move the replacement a hundredth of a second later (Right arrow), for getting the consonants to land together">Nudge ▶</button>
      <button type="button" class="btn" data-move="+beat" title="Move the replacement one beat later (Shift+Right), for when the phrases land a beat apart">Beat ▶</button>
      <button type="button" class="btn" data-move="+bar" title="Move the replacement one whole bar later (Ctrl+Right), for when it is a bar out">Bar ▶</button>
      <button id="suggested" type="button" class="btn" title="Put the replacement back where the tool first placed it, by listening to where it lines up with the song">Reset alignment</button>
    </div>
  </section>

  <div id="bottom">
    <div id="levelcard" class="card bar">
      <span class="cap">Replacement level</span>
      <span class="cap">Quieter</span>
      <input id="trim" type="range" step="0.5" aria-label="Level of the replacement" title="How loud the replacement is. In the middle it is as loud as the stem it replaces. Left is quieter, right is louder.">
      <span class="cap">Louder</span>
      <button id="matched" type="button" class="btn" title="Set the level back to as loud as the stem it replaces">Match level</button>
      <span id="leveltext"></span>
      <p id="notes"></p>
    </div>
    <div id="actioncard" class="card bar">
      <button id="restore" type="button" class="btn" title="Put the song’s own stem back, exactly as it was before it was replaced">Restore original</button>
      <button id="replace" type="button" class="btn hot" title="Save the replacement into the song, at this place and level. The stem it replaces is kept, so Restore original brings it back.">Replace stem</button>
    </div>
  </div>

  <section id="keycard" class="card bar" aria-label="Transpose the chords and notes">
    <span class="cap" title="For a song whose stems you replaced with ones in another key: this moves what Chord Buddy shows (the chords, the key, the lead sheet and the MIDI parts) to match. It does not change any sound.">Transpose analysis</span>
    <button id="keydown" type="button" class="btn sq" title="One semitone lower">−</button>
    <span id="keyamount" title="How far to move the chords and notes">0 semitones</span>
    <button id="keyup" type="button" class="btn sq" title="One semitone higher">+</button>
    <span id="keypreview"></span>
    <label class="check" id="melodywrap" hidden title="This lead sheet has syllables you placed by hand under its notes. Moving the melody resets them (Undo in Chord Buddy brings them back). Unticked, only the lead sheet’s chord symbols move."><input id="melody" type="checkbox"> Move the lead sheet’s melody too</label>
    <button id="transpose" type="button" class="btn hot" title="Move this song’s chords, key, lead sheet and MIDI parts by this much. Each gets one new step in its history in Chord Buddy, so Undo there takes it back.">Transpose</button>
    <p id="keywarn"></p>
  </section>

  <section id="flagcard" class="card bar" aria-label="Copy from another song">
    <span class="cap" title="For two songs that are the same music, like a lowered version: copy the other song’s song structure, lyrics or action flags onto this one. Each lands at the same moment of the music, even where the two analyses number the bars differently.">Copy from</span>
    <select id="flagsong" aria-label="The song to copy from" title="The song to copy from. Songs with a chart or an arrangement are listed."></select>
    <label class="check" data-tip="Its sections: their names and where each begins and ends, plus which repeats are shown folded and where the chart’s lines break. This song keeps its own chords and its own lyrics (each line moves into the section it is sung in). One step in its chart’s history, so Undo on its Chart tab takes it back."><input id="flagstruct" type="checkbox"> Copy song structure</label>
    <label class="check" data-tip="Its lyrics, each word at the same moment of the music. They replace this song’s own lyrics and go into whichever of this song’s sections they are sung in. One step in its chart’s history, so Undo on its Chart tab takes it back."><input id="flaglyrics" type="checkbox"> Copy lyrics</label>
    <label class="check" data-tip="One of its arrangements from the Perform tab (action flags, loops, jumps and holds), added to this song as a new arrangement, each at the same moment of the music. Nothing is replaced."><input id="flagflags" type="checkbox"> Copy action flags</label>
    <select id="flagperf" aria-label="Which arrangement to copy" title="Which of that song’s arrangements to copy"></select>
    <label id="flagnamewrap" title="What the copied arrangement is called on this song’s Perform tab. It starts as the name of the one you are copying; type another to tell them apart. If this song already has one by that name, a number is added.">Arrangement name <input id="flagname" type="text" maxlength="80" autocomplete="off" spellcheck="false" aria-label="Name for the copied arrangement"></label>
    <label class="check" id="flagcountwrap" hidden title="Chord Buddy counts bar 1 from the first chord in the chart. This song’s analysis heard a chord sooner than the other’s (in a fade-in, say), so its bars are numbered differently. Ticked, those early chords become rests in this song’s chart, and both songs then have bar 1 in the same place. Undo on its Chart tab takes it back."><input id="flagcount" type="checkbox" checked> <span id="flagcountwords"></span></label>
    <span id="flagpreview"></span>
    <button id="flagcopy" type="button" class="btn hot" title="Copy what is ticked onto the song chosen at the top. The other song is left as it is.">Copy to song</button>
  </section>

  <details class="card">
    <summary>Activity log <span id="last"></span></summary>
    <div id="log" role="log" aria-live="polite"></div>
  </details>
  <div id="busy" role="status" hidden>Working…</div>

<script type="module">
// The page of the Replace a Stem window. Python (controller.py) does the work and holds the truth; this draws it and sends what the person does.
// The new audio is shown as a shape on the song's own bars, beats and sections (worked out by the app's own chart code), and is slid into place
// by dragging it or with the Bar / Beat / Nudge buttons. Nothing here reads or writes the library.
const $=id=>document.getElementById(id);
const NUDGE=.01;                       // the tiny step, in seconds: a hundredth, about as fine as an ear can place a consonant
let api=null,state=null,busy=0;
let bars=[],sections=[],waves={},perSecond=100,seconds=0,hasChart=false;
let view={start:0,pps:60},playhead=0,hear='new',looping=false,snapping=true;
let offset=0,dragging=null,playing=null,restartTimer=0,levelTimer=0,trimDrag=false;
let keySteps=0,keyPlan=null,keySerial=0,shownKey=null;
let targetMeasures=[],targetChart=null,flagSources=[],flagPlan=null,flagBars=null,flagGrid=null,flagSerial=0,flagCount=null,flagStructureFor='';
let flagTiming=null,flagNameTyped=false;

// ---- the app's own pieces, if they can be had: its chart code (for the grid) and its icons
let buildChartModel=null,icon=name=>'';
try{({buildChartModel}=await import('/web/chart-model.js'));}catch{/* no bars then: the grid is drawn in seconds */}
try{({icon}=await import('/web/icons.js'));}catch{/* words instead of pictures */}
// the app's own way of naming a song's key (key-estimate.js): the same code that decides what its key chip says
let keyCode=null,noChord=label=>!label||label==='N';
try{keyCode=await import('/web/key-estimate.js');}catch{/* the key is then named from the saved choice or the model's file alone */}
try{({isNoChordLabel:noChord}=await import('/web/chart-layout.js'));}catch{/* 'N' is the usual no-chord mark */}
let gridFingerprint=null,matchBars=null,matchWords=null;
try{({matchBars,matchWords}=await import('/tool/bar-match.js'));}catch{/* no copying of flags then; said in its row */}
try{({gridFingerprint}=await import('/web/performance-compiler.js'));}catch{/* the copy is then saved without the bars' stamp, which the Perform tab adds on its next save */}
const withIcon=(node,name,words)=>{node.innerHTML=(icon(name)||'')+(words?`<em style="font-style:normal">${words}</em>`:'');if(!icon(name)&&!words)node.textContent=name;};
withIcon($('snap'),'magnet','');withIcon($('zoomout'),'minus','');withIcon($('zoomin'),'plus','');
$('snap').setAttribute('aria-label','Snap to beats');$('zoomout').setAttribute('aria-label','Zoom out');$('zoomin').setAttribute('aria-label','Zoom in');

// ---- the grid
function readChart(chart){
  bars=[];sections=[];hasChart=false;targetMeasures=[];targetChart=chart||null;
  if(chart&&buildChartModel)try{
    const model=buildChartModel(chart.content,chart.music);
    bars=model.measures.map(m=>({id:m.id,start:m.start,end:m.end,number:m.number-model.barOffset,beats:(m.beats&&m.beats.length?m.beats:[m.start])}));
    targetMeasures=model.measures;
    sections=model.sections.map(s=>({name:s.name,start:s.start,end:s.end}));
    hasChart=bars.length>0;
  }catch{bars=[];sections=[];}
}
const barAt=t=>{if(!bars.length)return null;if(t<bars[0].start)return bars[0];for(const b of bars)if(t>=b.start&&t<b.end)return b;return bars.at(-1);};
const beatLength=t=>{const b=barAt(t);return b?(b.end-b.start)/b.beats.length:.5;};      // with no chart, a "beat" is half a second
const barLength=t=>{const b=barAt(t);return b?b.end-b.start:2;};
const beatsNear=t=>{const b=barAt(t);return b?[...b.beats,b.end]:[Math.round(t*2)/2];};
const nearestBeat=t=>beatsNear(t).reduce((best,x)=>Math.abs(x-t)<Math.abs(best-t)?x:best);
const clockWords=t=>`${Math.floor(Math.max(0,t)/60)}:${String(Math.floor(Math.max(0,t)%60)).padStart(2,'0')}`;
/** A place in the song the way a musician says it: "bar 9, beat 3". */
function placeWords(t){
  if(!hasChart)return clockWords(t);
  if(t<bars[0].start-.02)return `${(bars[0].start-t).toFixed(1)} s before bar ${bars[0].number}`;
  if(t>=bars.at(-1).end)return 'after the last bar';
  const b=barAt(t);let i=0;while(i<b.beats.length-1&&b.beats[i+1]<=t+.005)i++;
  const next=i<b.beats.length-1?b.beats[i+1]:b.end,part=(t-b.beats[i])/Math.max(.01,next-b.beats[i]);
  const beat=part<.12?`beat ${i+1}`:part>.88?(i+1<b.beats.length?`beat ${i+2}`:`the end of the bar`):part>.38&&part<.62?`the “and” of ${i+1}`:`just ${part<.5?'after':'before'} ${part<.5?`beat ${i+1}`:(i+1<b.beats.length?`beat ${i+2}`:'the barline')}`;
  return `bar ${b.number}, ${beat}`;
}
/** How far the new audio sits from where it was found, in beats and bars. */
function movedWords(){
  if(state?.suggested==null)return '';
  const d=offset-state.suggested;if(Math.abs(d)<.004)return 'right where it was found';
  if(!hasChart)return `${Math.abs(d).toFixed(2)} s ${d>0?'later':'earlier'} than where it was found`;      // a song with no chart has no beats to count in
  const beat=beatLength(Math.max(0,offset)),n=Math.abs(d)/beat,way=d>0?'later':'earlier';
  const perBar=Math.max(1,Math.round(barLength(Math.max(0,offset))/beat)),inBars=n/perBar;
  let amount;
  if(n<.2)amount='a touch';
  else if(inBars>=1&&Math.abs(inBars-Math.round(inBars))<.06)amount=`${Math.round(inBars)} bar${Math.round(inBars)===1?'':'s'}`;
  else{const q=Math.round(n*4)/4;amount=q===.25?'a quarter of a beat':q===.5?'half a beat':q===.75?'three quarters of a beat':q===1?'1 beat':`${q} beats`;}
  return `${amount} ${way} than where it was found`;
}

// ---- asking Python: one thing at a time, in order; the slow ones show "Working…"
let line=Promise.resolve();
function ask(name,args=[],{slow=false}={}){
  const run=async()=>{
    if(slow){busy++;enable();}
    try{const answer=await api[name](...args);if(answer&&'songs' in answer)take(answer);return answer;}
    catch(error){note('That did not work: '+(error?.message||error));return null;}
    finally{if(slow){busy--;enable();}}
  };
  line=line.then(run,run);return line;
}
function note(text){const p=document.createElement('p');p.textContent=text;$('log').append(p);$('last').textContent='· '+text;}
async function loadTimeline(){
  const t=await ask('timeline',[],{slow:true});if(!t)return;
  readChart(t.chart);waves=t.waves||{};perSecond=t.per_second||100;
  seconds=state?.seconds||0;clampView();draw();
}

// ---- what Python says is so
function take(next){
  const first=!state;state=next;
  document.documentElement.dataset.theme=state.theme;document.documentElement.dataset.scheme=state.scheme;
  const songBox=$('song');
  songBox.replaceChildren(new Option(state.songs.length?'Choose a song…':'No song has split stems yet',''),
    ...state.songs.map(s=>new Option(`${s.title}${s.artist?' · '+s.artist:''}  (${s.length})${s.replaced.length?'  · replaced: '+s.replaced.join(', ').toLowerCase():''}`,s.id)));
  songBox.value=state.song||'';
  if(!$('role').options.length)$('role').replaceChildren(...state.stems.map(s=>new Option(s.name,s.id)));
  $('role').value=state.role;
  $('file').textContent=state.file||'No file chosen';$('file').title=state.file||'';
  if(!dragging)offset=state.offset;
  seconds=state.seconds||0;
  if(first){$('volume').value=state.start_volume;}
  const trim=$('trim');trim.min=state.trim_range[0];trim.max=state.trim_range[1];if(!trimDrag)trim.value=state.trim_db;
  // the level's state (the Match level button is the action): matched to the old stem, or how far from it
  const fromMatch=Math.abs(state.trim_db)<.05?'Matched':`${state.trim_db>0?'+':''}${state.trim_db.toFixed(1)} dB from matched`;
  $('leveltext').textContent=!state.file?'':`${fromMatch} · ${state.gain_db>0?'+':''}${state.gain_db.toFixed(1)} dB on the file${state.level_checked?'':' · checking…'}`;
  $('leveltext').title=!state.file?'':'How much the replacement file is turned up or down to sit at this level';
  $('notes').textContent=state.notes.join(' ');
  $('replace').textContent=`Replace ${state.song?state.role_name.toLowerCase():'stem'}`;
  const log=$('log');log.replaceChildren(...state.messages.map(m=>{const p=document.createElement('p');p.textContent=m;return p;}));log.scrollTop=log.scrollHeight;
  $('last').textContent=state.messages.length?'· '+state.messages.at(-1):'';

  const preview=$('flagpreview');preview.textContent='';preview.title='';$('flagcountwrap').hidden=true;
  for(const p of Object.keys(PART_BOX))setPart(p,false,'');
  const source=flagSources.find(s=>s.id===$('flagsong').value),performance=$('flagperf').value;
  if(!source){enable();return;}
  const serial=++flagSerial;
  if(!buildChartModel||!bars.length||!bars[0].id){preview.textContent='This song has no chart yet. Analyze it in Chord Buddy first.';enable();return;}
  const chart=await api.chart_of(source.id);if(serial!==flagSerial)return;
  let theirs=[],theirStart=null;
  let theirBeats=new Map();
  try{const model=buildChartModel(chart.content,chart.music);theirStart=model.presentation?.start??null;theirs=model.measures.map(m=>({id:m.id,number:m.number-model.barOffset,start:m.start,end:m.end,beats:(m.beats&&m.beats.length)||1}));
    theirBeats=new Map(model.measures.map(m=>[m.id,(m.beats&&m.beats.length?m.beats:[m.start])]));}catch{theirs=[];}
  if(!theirs.length){preview.textContent='That song has no chart yet. Analyze it in Chord Buddy first.';enable();return;}
  if(!matchBars){preview.textContent='A part of this tool is missing (bar-match.js), so nothing can be copied.';enable();return;}
  // Two analyses of the same music rarely number their bars alike, so bars are paired by when they are in the music (bar-match.js), after the
  // two recordings have been lined up by ear in case one has more silence in front.
  preview.textContent='Lining the two recordings up…';
  const align=await api.flag_alignment(source.id);if(serial!==flagSerial)return;
  const mine=bars.map(b=>({id:b.id,number:b.number,start:b.start,end:b.end,beats:b.beats.length}));
  const match=matchBars(theirs,mine,align?.offset||0);
  if(!match.matched){preview.textContent=matchWords(match,theirs,{theirs:source.title,mine:state.title});enable();return;}
  // each pair of bars with its times too: a section's edge or a word's place is carried across by them (structure.py)
  const mineById=new Map(mine.map(b=>[b.id,b])),matched={};
  for(const b of theirs){const p=match.bars[b.id],to=p&&mineById.get(p.id);if(to)matched[b.id]={...p,number:b.number,from:[b.start,b.end],to:[to.start,to.end]};}
  // and every bar's beat times, both songs': on a bar the two analyses cut differently, things go to the same moment of the music instead (flags.py)
  const timing={shift:(align?.offset||0)+match.phase,
    theirs:Object.fromEntries(theirs.map(b=>[b.id,{number:b.number,beats:theirBeats.get(b.id)||[b.start],end:b.end}])),
    mine:bars.map(b=>({id:b.id,number:b.number,start:b.start,end:b.end,beats:b.beats}))};
  flagBars=matched;flagTiming=timing;
  try{flagGrid=gridFingerprint?gridFingerprint(targetMeasures):null;}catch{flagGrid=null;}
  // the action flags: one arrangement of it
  if(performance){
    const answer=await api.flags_plan(performance,matched,null,timing);if(serial!==flagSerial)return;
    if(answer?.error)flagWhy.flags=answer.error;else flagPlan=answer.plan;
  }else flagWhy.flags='that song has no arrangement on its Perform tab.';
  // Can this song's bars be counted like the other's? Its early chords (the ones before the other song's first chord) would become rests: try
  // that on a copy of its chart, with the app's own chart code, and offer it only if the two then agree on every bar number.
  if(match.shift&&Number.isFinite(theirStart)&&targetChart?.content?.chords){
    const cutoff=theirStart+(align?.offset||0)+match.phase-beatLength(Math.max(0,theirStart))/2;
    const real=c=>typeof c.label==='string'&&/^[A-G]/.test(c.label),early=targetChart.content.chords.filter(c=>c.start<cutoff&&real(c));
    if(early.length)try{
      const tried=buildChartModel({...targetChart.content,chords:targetChart.content.chords.map(c=>early.includes(c)?{...c,label:'N'}:c)},targetChart.music);
      const renumbered=tried.measures.map(m=>({id:m.id,number:m.number-tried.barOffset,start:m.start,end:m.end,beats:(m.beats&&m.beats.length)||1}));
      const again=matchBars(theirs,renumbered,align?.offset||0);
      if(again.shift===0&&!again.mixed)flagCount={cutoff,count:early.length,chords:[...new Set(early.map(c=>c.label))]};
    }catch{flagCount=null;}
  }
  if(flagCount){
    $('flagcountwrap').hidden=false;
    $('flagcountwords').textContent=`Count bars like “${source.title}” (${plural(flagCount.count,'early chord')} here, ${flagCount.chords.join(', ')}, ${flagCount.count===1?'becomes a rest':'become rests'})`;
  }
  // the song structure and the lyrics, each asked about on its own (the app's own chart rules are run on the result before it is offered)
  for(const p of ['structure','lyrics']){
    const answer=await api.structure_plan(source.id,matched,timing,[p]);if(serial!==flagSerial)return;
    if(answer?.plan?.ok)flagParts[p]=answer.plan;else flagWhy[p]=answer?.plan?.reason||answer?.error||'';
  }
  // and both together: the lyrics then go into the other song's own sections, so what fits can differ from the lyrics alone
  if(flagParts.structure&&flagParts.lyrics){
    const answer=await api.structure_plan(source.id,matched,timing,['structure','lyrics']);if(serial!==flagSerial)return;
    if(answer?.plan?.ok)flagParts.both=answer.plan;
  }
  // what is ticked to begin with, once per pair of songs (then your own ticks stay): the lyrics only when they would not replace this song's own
  const key=source.id+'>'+state.song;
  if(flagStructureFor!==key){flagStructureFor=key;flagTicks={structure:!!flagParts.structure,lyrics:!!flagParts.lyrics&&!flagParts.lyrics.replaces,flags:!!flagPlan};}
  setPart('structure',!!flagParts.structure,flagWhy.structure);setPart('lyrics',!!flagParts.lyrics,flagWhy.lyrics);setPart('flags',!!flagPlan,flagWhy.flags);
  const counting=flagCount&&$('flagcount').checked;
  flagHow=[counting?'Bar 1 will be the same bar in both songs.':matchWords(match,theirs,{theirs:source.title,mine:state.title}),align?.words||''].filter(Boolean).join(' ');
  showFlagPreview();enable();
}
/** One line saying what Copy to song will copy; anything to watch for is said after it, the how and why are in its hover text. */
function showFlagPreview(){
  const preview=$('flagpreview'),bits=[],watch=[];
  const both=ticked('structure')&&ticked('lyrics')&&flagParts.both;
  if(ticked('structure')){const p=flagParts.structure;bits.push(plural(p.sections.length,'section')+(p.folds?' (with folded repeats)':''));if(!both)watch.push(...p.notes);}
  if(ticked('lyrics')){const p=flagParts.lyrics;bits.push(plural(p.lyric_lines,'lyric line'));if(p.replaces)watch.push(`They replace this song’s own ${plural(p.replaces,'lyric line')}.`);if(!both)watch.push(...p.notes);}
  if(both)watch.push(...flagParts.both.notes);
  if(ticked('flags')){const c=flagPlan.copied;bits.push([plural(c.flags,'action flag'),...(c.loops?[plural(c.loops,'loop')]:[]),...(c.jumps?[plural(c.jumps,'jump')]:[]),...(c.holds?[plural(c.holds,'hold')]:[])].join(', '));
    if(flagPlan.left_out_words)watch.push(flagPlan.left_out_words);}
  for(const p of ['structure','lyrics'])if(!flagParts[p]&&flagWhy[p]&&!/already has the same/.test(flagWhy[p]))watch.push(flagWhy[p]);
  const list=bits.length>1?bits.slice(0,-1).join(', ')+' and '+bits.at(-1):bits[0];
  preview.textContent=(bits.length?`Copies ${list}.`:'Tick what to copy.')+(watch.length?' '+[...new Set(watch)].join(' '):'');
  preview.title=flagHow;
}
$('flagsong').onchange=()=>flagSongChosen();
$('flagperf').onchange=()=>{nameFromArrangement();flagChanged();};
$('flagname').oninput=()=>{flagNameTyped=$('flagname').value.trim()!=='';};
$('flagcount').onchange=()=>flagChanged();
for(const [p,id] of Object.entries(PART_BOX))$(id).onchange=()=>{flagTicks[p]=$(id).checked;showFlagPreview();enable();};
$('flagcopy').onclick=async()=>{
  if(!flagBars)return;
  const source=flagSources.find(s=>s.id===$('flagsong').value);
  const parts=['structure','lyrics'].filter(p=>ticked(p)&&flagParts[p]),withFlags=ticked('flags')&&!!flagPlan;
  if(!parts.length&&!withFlags)return;
  const named=$('flagname').value.trim()||flagPlan?.from;
  const lines=[`Copy from “${source?.title}” to “${state.title}”?`,''];
  if(parts.includes('structure'))lines.push(`• Song structure: ${flagParts.structure.summary}.`);
  const lyricsPlan=parts.length===2&&flagParts.both?flagParts.both:flagParts.lyrics;
  if(parts.includes('lyrics'))lines.push(`• Lyrics: ${lyricsPlan.summary.replace(/^.*?(\d+ lyric line)/,'$1')}.`+(flagParts.lyrics.replaces?` They replace its own ${plural(flagParts.lyrics.replaces,'lyric line')}.`:''));
  if(withFlags)lines.push(`• Action flags: the arrangement “${flagPlan.from}”, added as a new arrangement named “${named}”. Nothing is replaced.`);
  if(parts.length)lines.push('',`Undo on its Chart tab takes back the ${parts.length===2?'song structure and lyrics':parts[0]==='structure'?'song structure':'lyrics'}.`);
  if(flagCount&&$('flagcount').checked)lines.push('',`Its bars will also be counted like “${source?.title}”: ${plural(flagCount.count,'early chord')} in its chart (${flagCount.chords.join(', ')}) ${flagCount.count===1?'becomes a rest':'become rests'}. Undo on its Chart tab takes that back.`);
  if(!confirm(lines.join(String.fromCharCode(10))))return;
  // counting the bars the other song's way first (the bars themselves do not change, only their numbers, so the flags' places stand)
  if(flagCount&&$('flagcount').checked)await ask('count_bars_like',[flagCount.cutoff,source?.title||null],{slow:true});
  if(parts.length)await ask('copy_structure',[source.id,flagBars,source?.title||null,flagTiming,parts],{slow:true});
  if(withFlags)await ask('copy_flags',[$('flagperf').value,flagBars,flagGrid,named,flagTiming],{slow:true});
  flagNameTyped=false;
  await loadTimeline();
  await loadFlagSources();
};

// keys: Space plays, L loops (as it does everywhere in Chord Buddy), the arrows slide the new audio (a nudge; Shift a beat; Ctrl a bar)
addEventListener('keydown',e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)&&e.target.type!=='range')return;
  if(e.key===' '){e.preventDefault();if(!$('play').disabled)playing?stop():play();}
  else if(e.key.toLowerCase()==='l'&&!e.ctrlKey&&!e.altKey){looping=!looping;enable();draw();replay();}
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&state?.file&&e.target.type!=='range'){
    e.preventDefault();step((e.key==='ArrowLeft'?'-':'+')+(e.ctrlKey?'bar':e.shiftKey?'beat':'nudge'));
  }
});

// The window hands the page its bridge a moment after the page loads, and fills it in a moment after that: the page starts only once the bridge
// can really be called (asking before then left the song list empty), whether the "ready" event is still to come or has already gone by.
let started=false;
function start(){
  if(started||typeof window.pywebview?.api?.state!=='function')return;
  started=true;api=window.pywebview.api;ask('state',[]).then(()=>{enable();draw();});
}
addEventListener('pywebviewready',start);
const waiting=setInterval(()=>{start();if(started)clearInterval(waiting);},100);
start();
window.__stemTool={get state(){return state;},get offset(){return offset;},get view(){return view;},get bars(){return bars;},get playhead(){return playhead;},placeWords,movedWords,draw,fit};   // for looking inside while testing
