<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chord Buddy · Hi-Fi Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
<style>
/* HI-FI DECK — a 1983 cassette deck that learned to read chords.
   Opinions: the mixer is hardware, so it's always on screen (no Stems tab).
   The current chord lives on a glowing amber display you can read from across the room.
   The chart is a typed cassette J-card tucked into the deck. */
:root{
  --chassis:#17130F; --panel:#221C17; --panel-2:#2C251E; --edge:#3A3129; --groove:#0E0B09;
  --metal-1:#D9D4CA; --metal-2:#A9A397; --metal-3:#7D776C;
  --amber:#FFB43F; --amber-dim:#7A4E12; --lcd:#1E1304; --lcd-2:#2A1B06;
  --red:#E5493B; --teal:#47B9A6; --plum:#A27ACB; --cream:#F4EBD6; --cream-2:#E9DCBF; --ink:#2A221B;
  --label:#B9AE9D; --label-dim:#776C5E;
  --wide:'Archivo',system-ui,sans-serif; --lcdf:'VT323',monospace; --type:'Courier Prime',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#2B231C,var(--chassis));color:var(--label);font:14px/1.4 var(--wide);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ic{width:18px;height:18px;flex:none}
.cap{font-stretch:125%;font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--label-dim)}
.deck{display:grid;grid-template-columns:230px 1fr 390px;grid-template-rows:auto 1fr auto;height:100vh;gap:14px;padding:14px}

/* Faceplate (top) */
.face{grid-column:1/-1;display:grid;grid-template-columns:230px 1fr auto;gap:14px;align-items:stretch}
.badge{border-radius:14px;background:linear-gradient(180deg,var(--metal-1),var(--metal-2));color:#2A241E;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 1px 0 #fff8,inset 0 -2px 0 #0003,0 8px 20px -10px #000;background-image:repeating-linear-gradient(90deg,#fff0 0 2px,#ffffff12 2px 3px),linear-gradient(180deg,var(--metal-1),var(--metal-2))}
.badge b{font:900 22px/1 var(--wide);font-stretch:125%;letter-spacing:-.01em}
.badge b span{color:var(--red)}
.badge small{font:700 9px/1.3 var(--wide);font-stretch:125%;letter-spacing:.22em;text-transform:uppercase;opacity:.7}
.stripes{display:flex;gap:3px;margin-top:8px}.stripes i{height:4px;flex:1;border-radius:2px}
.stripes i:nth-child(1){background:var(--red)}.stripes i:nth-child(2){background:var(--amber)}.stripes i:nth-child(3){background:var(--teal)}.stripes i:nth-child(4){background:var(--plum)}

.lcd{position:relative;border-radius:14px;background:var(--groove);padding:8px;box-shadow:inset 0 2px 8px #000,0 1px 0 #ffffff10}
.lcd-in{height:100%;border-radius:9px;background:radial-gradient(120% 140% at 30% 0%,var(--lcd-2),var(--lcd));display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:26px;padding:10px 24px;color:var(--amber);font-family:var(--lcdf);text-shadow:0 0 10px #FFB43F88,0 0 2px #FFB43F;overflow:hidden;position:relative}
.lcd-in::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 2px,#0000002a 2px 3px);pointer-events:none}
.reels{display:flex;gap:10px}
.reel{width:58px;height:58px;border-radius:50%;border:3px solid var(--amber-dim);display:grid;place-items:center;position:relative}
.reel svg{width:46px;height:46px;color:var(--amber)}
.is-playing .reel svg{animation:spin 1.8s linear infinite}
.is-playing .reel:last-child svg{animation-duration:2.6s}
@keyframes spin{to{transform:rotate(360deg)}}
.big{display:flex;flex-direction:column;line-height:1}
.big .cap{color:var(--amber-dim);text-shadow:none;font-family:var(--wide)}
.chordbig{font:400 84px/0.85 var(--lcdf);letter-spacing:.02em;min-width:150px}
.chordbig .q{font-size:.55em}
.readout{display:grid;grid-template-columns:repeat(3,auto);gap:4px 26px;font-size:30px;line-height:1}
.readout .cap{font-family:var(--wide);color:var(--amber-dim);text-shadow:none;font-size:9px;display:block;margin-bottom:2px}
.readout .next .q{font-size:.8em}
.beat-dots{display:flex;gap:8px;margin-top:6px}
.beat-dots i{width:16px;height:8px;border-radius:2px;background:var(--amber-dim);box-shadow:none}
.beat-dots i:nth-child(1){width:26px}
.beat-dots[style*="--b: 0"] i:nth-child(1),.beat-dots[style*="--b: 1"] i:nth-child(2),.beat-dots[style*="--b: 2"] i:nth-child(3),.beat-dots[style*="--b: 3"] i:nth-child(4){background:var(--amber);box-shadow:0 0 10px var(--amber)}
.lcd-right{text-align:right;font-size:26px;line-height:1.05}
.lcd-right .t{font-size:44px}
.rec{display:inline-flex;align-items:center;gap:6px;font-family:var(--wide);font-size:10px;letter-spacing:.2em;color:var(--amber-dim);text-shadow:none}
.rec i{width:8px;height:8px;border-radius:50%;background:#4a1a12}
.is-playing .rec i{background:var(--red);box-shadow:0 0 8px var(--red)}

.keys{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:1fr 1fr;gap:8px}
.key{border-radius:10px;background:linear-gradient(180deg,#3B332B,#29221C);color:var(--label);box-shadow:inset 0 1px 0 #ffffff1a,0 4px 0 #0c0907,0 6px 10px -2px #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .06s,box-shadow .06s}
.key .cap{font-size:8px;color:var(--label-dim)}
.key:active{transform:translateY(3px);box-shadow:inset 0 1px 0 #ffffff1a,0 1px 0 #0c0907}
.key.play{grid-row:span 2;background:linear-gradient(180deg,#FFC665,#E8952B);color:#3a2306;box-shadow:inset 0 1px 0 #fff6,0 4px 0 #8A5410,0 8px 16px -4px #000}
.key.play .ic{width:30px;height:30px}
.key.on{color:var(--amber);box-shadow:inset 0 1px 0 #ffffff1a,0 2px 0 #0c0907,0 0 0 1px var(--amber-dim)}
.key.on::after{content:'';width:18px;height:3px;border-radius:2px;background:var(--amber);box-shadow:0 0 6px var(--amber)}
.key [data-bind="rate"]{font:600 11px var(--wide)}

/* Shelf (left) */
.shelf{background:var(--panel);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;gap:10px;min-height:0;box-shadow:inset 0 1px 0 #ffffff0d}
.shelf-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.shelf-head button{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--panel-2);color:var(--amber)}
.setlists{display:flex;flex-wrap:wrap;gap:6px}
.setlist{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--panel-2);font-weight:600;font-size:12px}
.setlist .ic{display:none}
.setlist em{font-style:normal;color:var(--label-dim);font-size:11px}
.setlist.active{background:var(--amber);color:#2b1a05}.setlist.active em{color:#6b4410}
.songs{display:flex;flex-direction:column;gap:6px;overflow-y:auto;overflow-x:hidden;min-height:0;flex:1;padding-right:2px}
.song{position:relative;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px 10px 18px;border-radius:6px;background:linear-gradient(90deg,#3a3129,#2d261f);box-shadow:inset 0 1px 0 #ffffff12,0 2px 0 #0007;overflow:hidden}
.song::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c,#776C5E)}
.song:nth-child(6n+1){--c:var(--red)}.song:nth-child(6n+2){--c:var(--teal)}.song:nth-child(6n+3){--c:var(--amber)}.song:nth-child(6n+4){--c:var(--plum)}.song:nth-child(6n+5){--c:#8DA05B}.song:nth-child(6n+6){--c:#D97757}
.song .grip{display:none}
.song-body{flex:1;min-width:0}
.song-body strong{display:block;font-stretch:80%;font-weight:800;font-size:14px;color:#EADFCB;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-body small{font-family:var(--type);font-size:11px;color:var(--label-dim)}
.song-len{font-family:var(--lcdf);font-size:18px;color:var(--label-dim)}
.song.active{background:linear-gradient(90deg,var(--cream),var(--cream-2));margin-left:8px}
.song.active strong{color:var(--ink)}.song.active small,.song.active .song-len{color:#7a6a55}
.song[data-status="busy"] small{color:var(--amber)}
.shelf-foot{display:flex;flex-direction:column;gap:8px}
.import{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:10px;border:1.5px dashed var(--edge);color:var(--amber);font-weight:700}
.import:hover{border-color:var(--amber)}
.engine{display:flex;align-items:center;gap:8px;font-size:11px;padding:0 4px}
.engine i{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px var(--teal)}

/* J-card (center) */
.bay{position:relative;border-radius:16px;background:var(--groove);padding:10px;min-height:0;display:flex;flex-direction:column;box-shadow:inset 0 3px 12px #000}
.bay-tabs{display:flex;gap:4px;padding:2px 6px 10px}
.bay-tab{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-weight:700;font-size:12px;color:var(--label-dim)}
.bay-tab .ic{width:15px}
.bay-tab.active{background:var(--panel-2);color:var(--amber)}
.bay-tools{margin-left:auto;display:flex;gap:4px}
.bay-tools button{width:32px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--label)}
.bay-tools button:hover{background:var(--panel-2)}
.saved{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--label-dim);margin-right:6px}
.saved i{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.jcard{flex:1;overflow:auto;border-radius:6px;background:var(--cream);color:var(--ink);padding:0 0 40px;min-height:0;position:relative;background-image:linear-gradient(90deg,transparent 46px,#E5484D40 46px 47.5px,transparent 47.5px),repeating-linear-gradient(0deg,transparent 0 31px,#2A221B10 31px 32px);background-attachment:local}
.jhead{display:flex;align-items:stretch;border-bottom:3px solid var(--ink)}
.jhead .spine{writing-mode:vertical-rl;transform:rotate(180deg);background:var(--red);color:var(--cream);font:900 11px/1 var(--wide);font-stretch:125%;letter-spacing:.2em;padding:12px 8px;text-transform:uppercase}
.jhead .t{padding:20px 26px 14px 58px;flex:1}
.jhead h2{margin:0;font:900 40px/0.95 var(--wide);font-stretch:62%;letter-spacing:-.01em;text-transform:uppercase}
.jhead p{margin:6px 0 0;font-family:var(--type);font-size:13px}
.jhead .side-ab{display:grid;place-items:center;padding:0 22px;border-left:3px solid var(--ink);font:900 46px/1 var(--wide);font-stretch:125%}
.chartbody{padding:10px 26px 0 58px}

.sec{padding:18px 0 8px;position:relative}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec-num{position:absolute;left:-44px;top:20px;width:30px;text-align:right;font:400 22px/1 var(--lcdf);color:#9b8a70}
.sec-name{margin:0;font:900 13px/1 var(--wide);font-stretch:125%;letter-spacing:.18em;text-transform:uppercase;background:var(--ink);color:var(--cream);padding:5px 10px 5px 10px;border-radius:3px}
.sec[data-name="chorus"] .sec-name{background:var(--red)}
.sec[data-name="verse"] .sec-name{background:#2E8F80}
.sec[data-name="interlude"] .sec-name{background:#7D5BA6}
.sec-time{font-family:var(--type);font-size:12px;color:#8a7a62}
.sec-tools{margin-left:auto;display:flex;gap:2px;opacity:.0;transition:.15s}
.sec:hover .sec-tools{opacity:1}
.sec-tools button{display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:5px;font:700 11px var(--wide);text-transform:uppercase;letter-spacing:.08em}
.sec-tools .ic{width:13px}
.sec-tools button:hover{background:var(--cream-2)}
.sec.now .sec-num{color:var(--red)}
.sec.now .sec-num::after{content:'▶';position:absolute;left:34px;top:0;font-size:14px}
.row{margin:2px 0 8px}
.bars{display:flex;flex-wrap:wrap;row-gap:12px;align-items:flex-start}
.bar{display:flex;gap:16px;padding:0 18px 0 12px;border-left:3px solid var(--ink);min-height:36px}
.tail{display:flex;align-items:flex-start}
.bar.last{border-right:3px solid var(--ink)}
.row:not(.has-lyrics) .bar{min-width:120px}
.pass-labels{display:none;flex-direction:column;padding-top:38px;margin-left:-4px}
.bar.line-start .pass-labels{display:flex}
.pass-labels span{font:700 11px/22px var(--type);color:#a99878}
.chunk{display:flex;flex-direction:column;min-width:2.4em}
.chord{font:800 24px/1 var(--wide);font-stretch:85%;color:var(--ink);padding:3px 6px;margin:0 0 6px -6px;border-radius:4px;align-self:flex-start;text-align:left}
.chord .q{font-size:.65em;vertical-align:.4em;margin-left:1px}
.chord:hover{background:var(--cream-2)}
.chord.selected{outline:2px dashed var(--red);outline-offset:1px}
.lyr{font:400 15px/22px var(--type);white-space:nowrap}
.repeat{font:900 20px/36px var(--wide);font-stretch:62%;color:var(--red);margin-left:8px}
.chunk.now .chord{background:var(--ink);color:var(--amber);text-shadow:0 0 8px #FFB43F99}
.row[data-cur] .lyr,.row[data-cur] .pass-labels span{opacity:.35}
.row[data-cur="0"] [data-pass="0"],.row[data-cur="1"] [data-pass="1"]{opacity:1!important}
.chunk.now .lyr{background:linear-gradient(transparent 60%,#FFB43F88 60%)}

/* Rack (right) */
.rack{background:var(--panel);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px;min-height:0;box-shadow:inset 0 1px 0 #ffffff0d}
.rack-head{display:flex;align-items:center;justify-content:space-between}
.src{display:flex;background:var(--groove);border-radius:9px;padding:3px;box-shadow:inset 0 1px 3px #000}
.src button{padding:5px 10px;border-radius:7px;font:700 10px var(--wide);font-stretch:125%;letter-spacing:.14em;text-transform:uppercase;color:var(--label-dim)}
.src button.active{background:var(--panel-2);color:var(--amber);box-shadow:0 0 0 1px var(--edge)}
.strips{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:5px;min-height:0}
.stem{display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto auto auto;justify-items:center;min-height:0;gap:8px;background:linear-gradient(180deg,var(--panel-2),#251F19);border-radius:10px;padding:10px 4px 8px;position:relative;box-shadow:inset 0 1px 0 #ffffff10}
.stem-icon{color:var(--label);opacity:.9}
.stem-icon .ic{width:18px;height:18px}
.stem-name{order:5;writing-mode:vertical-rl;transform:rotate(180deg);font:800 10px/1 var(--wide);font-stretch:125%;letter-spacing:.14em;text-transform:uppercase;color:var(--label);height:86px;text-align:left;white-space:nowrap;display:none}
.track{position:relative;display:flex;gap:4px;height:100%;min-height:0;align-items:stretch;overflow:hidden}
.meter{width:8px;border-radius:2px;background:#120e0b;position:relative;overflow:hidden;box-shadow:inset 0 1px 2px #000}
.meter i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--lvl,0)*100%);background:linear-gradient(0deg,var(--teal) 0 55%,var(--amber) 55% 82%,var(--red) 82%);background-size:100% 140px;background-position:bottom;-webkit-mask:repeating-linear-gradient(0deg,#000 0 4px,#0000 4px 6px);mask:repeating-linear-gradient(0deg,#000 0 4px,#0000 4px 6px)}
.fader{writing-mode:vertical-lr;direction:rtl;width:22px;height:100%;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;margin:0}
.fader::-webkit-slider-runnable-track{width:4px;background:#0e0b09;border-radius:2px;box-shadow:inset 0 1px 2px #000}
.fader::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:14px;border-radius:3px;background:linear-gradient(180deg,var(--metal-1),var(--metal-3));box-shadow:0 2px 4px #000,inset 0 -1px 0 #0005;margin-left:-9px;border-top:2px solid transparent;background-clip:padding-box}
.mute,.solo{width:100%;max-width:38px;height:24px;border-radius:5px;font:800 11px var(--wide);background:#1A1511;color:var(--label-dim);box-shadow:inset 0 1px 0 #ffffff0d,0 2px 0 #0008}
.stem.muted .mute{background:var(--red);color:#fff;box-shadow:0 0 10px #E5493B88}
.stem.soloed .solo{background:var(--amber);color:#2b1a05;box-shadow:0 0 10px #FFB43F88}
.stem.muted{opacity:.6}
.strip-label{font:800 9px/1.1 var(--wide);font-stretch:125%;letter-spacing:.1em;text-transform:uppercase;text-align:center;color:var(--label);min-height:20px}
.master{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--groove)}
.master input{flex:1;accent-color:var(--amber)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{padding:5px 9px;border-radius:6px;background:var(--panel-2);font:700 10.5px var(--wide);color:var(--label)}
.presets button:first-child{color:var(--amber);box-shadow:0 0 0 1px var(--amber-dim)}

/* Tape lane (bottom) */
.tape{grid-column:1/-1;display:grid;grid-template-columns:1fr;gap:6px;background:var(--panel);border-radius:14px;padding:10px 14px 12px}
.tape-top{display:flex;justify-content:space-between;align-items:center}
.lane{position:relative;height:84px;border-radius:9px;background:var(--groove);overflow:hidden;cursor:pointer;box-shadow:inset 0 2px 6px #000}
.blocks{position:absolute;left:0;right:0;top:6px;height:22px}
.blk{position:absolute;top:0;height:22px;padding:0 2px}
.blk span{display:flex;align-items:center;padding:0 8px;height:100%;border-radius:4px;background:#3A3129;color:var(--label);font:800 10px var(--wide);font-stretch:125%;letter-spacing:.14em;text-transform:uppercase;overflow:hidden;white-space:nowrap;border-left:4px solid #776C5E}
.blk[data-name="verse"] span{border-color:var(--teal)}
.blk[data-name="chorus"] span{border-color:var(--red)}
.blk[data-name="interlude"] span{border-color:var(--plum)}
.blk.now span{background:var(--amber);color:#2b1a05;border-color:#2b1a05}
.wave{position:absolute;left:4px;right:4px;top:34px;bottom:6px}
.wave svg{position:absolute;inset:0;width:100%;height:100%}
.wave-base{fill:#3A3129}
.wave-played{fill:var(--amber);clip-path:inset(0 calc(100% - var(--p)) 0 0);filter:drop-shadow(0 0 4px #FFB43F66)}
.head{position:absolute;top:0;bottom:0;left:var(--p);width:2px;background:var(--red);box-shadow:0 0 8px var(--red);pointer-events:none}
.time{font:400 20px var(--lcdf);color:var(--amber)}

/* popover */
.pop{position:absolute;z-index:50;width:300px;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px;box-shadow:0 20px 40px -10px #000;color:var(--label);font-family:var(--wide)}
.pop-title{display:flex;gap:6px;align-items:center;font:800 10px var(--wide);font-stretch:125%;letter-spacing:.2em;text-transform:uppercase;color:var(--label-dim)}
.pop-title .ic{width:13px}
.pop-input{margin:10px 0;padding:8px 14px;border-radius:8px;background:var(--lcd);color:var(--amber);font:400 40px/1 var(--lcdf);text-shadow:0 0 8px #FFB43F88;display:flex;align-items:center}
.caret{width:14px;height:4px;background:var(--amber);margin-left:4px;align-self:flex-end;margin-bottom:6px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pop-sugs{display:flex;gap:6px;flex-wrap:wrap}
.pop-sugs button{padding:5px 10px;border-radius:6px;background:var(--panel-2);font-weight:700;font-size:13px;color:#EADFCB;box-shadow:0 2px 0 #0008}
.pop-scope{display:flex;gap:6px;margin:12px 0}
.pop-scope button{flex:1;padding:7px;border-radius:7px;font:700 11px var(--wide);background:var(--groove);color:var(--label-dim);display:flex;gap:4px;justify-content:center;align-items:center;white-space:nowrap}
.pop-scope .ic{width:12px}
.pop-scope button.on{color:var(--amber);box-shadow:0 0 0 1px var(--amber-dim)}
.pop-foot{display:flex;justify-content:space-between}
.pop-foot button{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;font-weight:700;font-size:12px}
.pop-foot .ic{width:13px}
.pop-done{background:var(--amber);color:#2b1a05}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="deck">
  <div class="face">
    <div class="badge"><div><b>CHORD<span>·</span>BUDDY</b><div class="stripes"><i></i><i></i><i></i><i></i></div></div><small>Auto-reverse<br>chord analysis deck</small></div>
    <div class="lcd"><div class="lcd-in">
      <div class="reels">
        <div class="reel"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3"><circle cx="24" cy="24" r="8"/><path d="M24 4v10M41.3 34l-8.7-5M6.7 34l8.7-5"/></svg></div>
        <div class="reel"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3"><circle cx="24" cy="24" r="8"/><path d="M24 4v10M41.3 34l-8.7-5M6.7 34l8.7-5"/></svg></div>
      </div>
      <div class="big"><span class="cap">Chord</span><span class="chordbig" data-bind="chord"></span></div>
      <div>
        <div class="readout">
          <div><span class="cap">Section</span><span data-bind="section"></span></div>
          <div><span class="cap">Bar</span><span data-bind="barno"></span></div>
          <div class="next"><span class="cap">Next</span><span data-bind="next"></span></div>
        </div>
        <div class="beat-dots"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="lcd-right"><span class="rec"><i></i>PLAY</span><div class="t"><span data-bind="time"></span></div><div style="color:var(--amber-dim)">/ <span data-bind="total"></span> · <span data-bind="pass"></span></div></div>
    </div></div>
    <div class="keys">
      <button class="key" data-action="rew"><span data-icon="rewind"></span><span class="cap">Prev</span></button>
      <button class="key play" data-action="play"></button>
      <button class="key" data-action="ffwd"><span data-icon="ffwd"></span><span class="cap">Next</span></button>
      <button class="key" data-action="loop"><span data-icon="loop"></span><span class="cap">Loop</span></button>
      <button class="key" data-action="slow"><span data-bind="rate">100%</span><span class="cap">Speed</span></button>
    </div>
  </div>

  <aside class="shelf">
    <div class="shelf-head"><span class="cap">Set lists</span><button title="New set list"><span data-icon="plus"></span></button></div>
    <div class="setlists" data-render="setlists"></div>
    <div class="shelf-head" style="margin-top:4px"><span class="cap">Tapes on the shelf</span><button title="Search"><span data-icon="search"></span></button></div>
    <div class="songs" data-render="songs" data-grip="false"></div>
    <div class="shelf-foot">
      <button class="import"><span data-icon="cassette"></span>Load an MP3</button>
      <div class="engine"><i></i>Engine ready · CPU</div>
    </div>
  </aside>

  <section class="bay">
    <div class="bay-tabs" data-tabs>
      <button class="bay-tab active" data-tab="chart"><span data-icon="chart"></span>J-card</button>
      <button class="bay-tab" data-tab="score"><span data-icon="score"></span>Lead sheet</button>
      <button class="bay-tab" data-tab="midi"><span data-icon="midi"></span>MIDI</button>
      <div class="bay-tools"><span class="saved"><i></i>Saved</span><button title="Undo"><span data-icon="undo"></span></button><button title="Redo"><span data-icon="redo"></span></button><button title="Download"><span data-icon="download"></span></button><button title="Analyze again"><span data-icon="sparkle"></span></button><button title="Settings"><span data-icon="gear"></span></button></div>
    </div>
    <div class="jcard" data-autoscroll data-view="chart">
      <div class="jhead"><div class="spine">Side A</div><div class="t"><h2 data-bind="title"></h2><p>Demo recording · Key D · 120 bpm · 4/4 · 1:14</p></div><div class="side-ab">A</div></div>
      <div class="chartbody" data-render="chart"></div>
    </div>
    <div class="jcard" data-view="score" hidden><div class="chartbody" style="padding-top:40px;font-family:var(--type)">Lead sheet renders on the same J-card stock.</div></div>
    <div class="jcard" data-view="midi" hidden><div class="chartbody" style="padding-top:40px;font-family:var(--type)">MIDI note editor goes here.</div></div>
  </section>

  <aside class="rack">
    <div class="rack-head"><span class="cap">Stem mixer</span><div class="src"><button data-source>Original</button><button data-source class="active">Stems</button></div></div>
    <div class="presets"><button>Full band</button><button>No vocals</button><button>Rhythm only</button><button>Just bass</button></div>
    <div class="strips" data-render="stems" data-text="true"></div>
    <div class="master"><span data-icon="volume"></span><input type="range" value="80" aria-label="Master volume"><span class="cap">Master</span></div>
  </aside>

  <footer class="tape">
    <div class="tape-top"><span class="cap">Tape · click to cue</span><span class="time"><span data-bind="bar"></span></span></div>
    <div class="lane" data-seek>
      <div class="blocks" data-render="blocks"></div>
      <div class="wave" data-render="wave" data-bars="220" data-mirror="true"></div>
      <div class="head"></div>
    </div>
  </footer>
</div>
<script src="mockup-core.js"></script>
<script>
  // Deck-specific: wrap meter + fader side by side and add a label under each strip.
  document.addEventListener('DOMContentLoaded', () => document.querySelectorAll('.stem').forEach((s) => {
    const track = document.createElement('div'); track.className = 'track';
    track.append(s.querySelector('.meter'), s.querySelector('.fader'));
    s.querySelector('.stem-icon').after(track);
    const lab = document.createElement('div'); lab.className = 'strip-label'; lab.textContent = s.querySelector('.stem-name').textContent.replace(' guitar', ' gtr');
    s.append(lab);
  }));
</script>
</body>
</html>
