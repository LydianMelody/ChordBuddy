<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chord Buddy · Riso Zine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* RISO ZINE — a two-colour risograph practice zine (fluoro pink + blue, with yellow highlighter).
   Opinions: no sidebar — songs are a deck of cards across the top, so the chart gets the full width.
   The transport sits up top like a ticket stub, right under the song you picked.
   Stems are a sticker sheet: big, tappable, colourful. */
:root{
  --paper:#F4EEE3; --paper-2:#EAE2D3; --ink:#1D1B2E; --pink:#FF4FA3; --blue:#2F5BD3; --yellow:#FFE14D; --mint:#3CC9A0; --orange:#FF7A3D;
  --pink-t:#FF4FA333; --blue-t:#2F5BD32b;
  --g:'Bricolage Grotesque',system-ui,sans-serif; --m:'Space Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--g);overflow:hidden;
  background-image:radial-gradient(#1D1B2E14 1px,transparent 1.2px);background-size:7px 7px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ic{width:18px;height:18px;flex:none}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh;gap:0}

/* Top: logo + set lists + song cards */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:16px 26px 12px}
.logo{position:relative;font:800 30px/0.9 var(--g);font-stretch:75%;letter-spacing:-.02em;text-transform:uppercase;transform:rotate(-3deg)}
.logo span{display:block;color:var(--blue);mix-blend-mode:multiply}
.logo span:last-child{color:var(--pink);margin-left:14px}
.logo::after{content:'♪';position:absolute;right:-18px;top:-6px;font-size:22px;color:var(--ink);transform:rotate(14deg)}
.shelf{display:flex;flex-direction:column;gap:8px;min-width:0}
.setlists{display:flex;gap:6px;align-items:center}
.setlist{display:flex;gap:6px;align-items:center;padding:4px 12px;border:2px solid var(--ink);border-radius:999px;font:700 12px var(--m);text-transform:uppercase}
.setlist .ic{display:none}
.setlist em{font-style:normal;opacity:.6}
.setlist.active{background:var(--ink);color:var(--yellow)}
.add-set{width:28px;height:28px;border:2px dashed var(--ink);border-radius:50%;display:grid;place-items:center}
.add-set .ic{width:14px}
.cards{display:flex;gap:12px;overflow-x:auto;padding:6px 4px 8px;scrollbar-width:none}
.song{flex:none;width:184px;text-align:left;padding:10px 12px 10px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);display:grid;grid-template-columns:1fr auto;gap:2px 8px;transition:transform .15s;position:relative}
.song:nth-child(3n+1){transform:rotate(-1.2deg)}.song:nth-child(3n+2){transform:rotate(.8deg)}.song:nth-child(3n){transform:rotate(-.4deg)}
.song .grip{display:none}
.song-body strong{display:block;font:800 16px/1.05 var(--g);font-stretch:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-body small{font:400 11px var(--m);opacity:.7}
.song-len{font:700 11px var(--m)}
.song:hover{transform:rotate(0) translateY(-3px)}
.song.active{background:var(--yellow);box-shadow:5px 5px 0 var(--pink);transform:rotate(-1deg) translateY(-2px)}
.song[data-status="busy"]{background:repeating-linear-gradient(-45deg,var(--paper) 0 8px,var(--blue-t) 8px 16px)}
.song[data-status="new"]::after{content:'NEW';position:absolute;top:-9px;right:10px;background:var(--pink);color:#fff;font:700 10px var(--m);padding:2px 6px;border-radius:4px;transform:rotate(4deg)}
.top-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:2px solid var(--ink);border-radius:12px;font:800 14px var(--g);background:var(--paper)}
.btn.hot{background:var(--pink);color:#fff;box-shadow:4px 4px 0 var(--ink)}
.btn.hot:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.mini{display:flex;gap:6px}
.mini button{width:34px;height:34px;border:2px solid var(--ink);border-radius:10px;display:grid;place-items:center;background:var(--paper)}
.mini .ic{width:16px}

/* Ticket transport */
.ticket{margin:0 26px;display:grid;grid-template-columns:auto auto 1fr auto;gap:22px;align-items:center;background:var(--blue);color:var(--paper);border-radius:18px;padding:14px 22px;position:relative;
  -webkit-mask:radial-gradient(circle 11px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket::before{content:'';position:absolute;inset:0;border-radius:18px;background-image:radial-gradient(#ffffff22 1.2px,transparent 1.4px);background-size:6px 6px;pointer-events:none}
.ticket h1{margin:0;font:800 34px/0.9 var(--g);font-stretch:75%;text-transform:uppercase;letter-spacing:-.01em;max-width:220px}
.ticket .meta{font:400 11px/1.5 var(--m);opacity:.85;margin-top:6px}
.ticket .meta b{background:var(--yellow);color:var(--ink);padding:0 4px;border-radius:3px}
.play-zone{display:flex;align-items:center;gap:8px}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--paper);color:var(--paper)}
.round.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.round.big{width:70px;height:70px;background:var(--pink);border:0;box-shadow:4px 4px 0 var(--ink);color:#fff}
.round.big .ic{width:30px;height:30px}
.round.big:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.pill{display:flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:999px;border:2px solid var(--paper);font:700 12px var(--m)}
.pill.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.lane{position:relative;height:88px;cursor:pointer}
.blocks{position:absolute;left:0;right:0;top:0;height:30px}
.blk{position:absolute;top:0;height:30px;padding:0 2px}
.blk span{display:flex;align-items:center;justify-content:center;height:100%;border-radius:8px;font:800 12px var(--g);text-transform:uppercase;letter-spacing:.04em;background:#ffffff26;color:var(--paper);overflow:hidden;white-space:nowrap}
.blk[data-name="verse"] span{background:var(--mint);color:var(--ink)}
.blk[data-name="chorus"] span{background:var(--pink);color:#fff}
.blk[data-name="interlude"] span{background:var(--orange);color:var(--ink)}
.blk.now span{background:var(--yellow);color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.wave{position:absolute;left:0;right:0;top:36px;bottom:0}
.wave svg{position:absolute;inset:0;width:100%;height:100%}
.wave-base{fill:#ffffff40}
.wave-played{fill:var(--yellow);clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.head{position:absolute;top:-4px;bottom:-4px;left:var(--p);width:3px;background:var(--ink);border-radius:2px;pointer-events:none}
.head::after{content:'';position:absolute;top:-6px;left:50%;width:14px;height:14px;background:var(--yellow);border:2.5px solid var(--ink);border-radius:50%;transform:translateX(-50%)}
.stub{text-align:right;border-left:2px dashed #ffffff66;padding-left:20px}
.stub .now{font:800 54px/0.9 var(--g);font-stretch:75%;color:var(--yellow)}
.stub .now .q{font-size:.55em}
.stub small{display:block;font:400 11px var(--m);opacity:.85}
.stub .src{display:flex;gap:4px;justify-content:flex-end;margin-top:6px}
.stub .src button{font:700 10px var(--m);text-transform:uppercase;padding:3px 8px;border:1.5px solid var(--paper);border-radius:999px}
.stub .src button.active{background:var(--paper);color:var(--blue)}

/* Body */
.body{display:grid;grid-template-columns:1fr 330px;gap:22px;padding:16px 26px 0;min-height:0}
.paper{min-height:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.tab{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:10px 10px 0 0;font:800 13px var(--g);border:2px solid transparent;border-bottom:0;opacity:.6}
.tab .ic{width:16px}
.tab.active{opacity:1;background:var(--yellow);border-color:var(--ink)}
.saved{margin-left:auto;font:400 11px var(--m);display:flex;gap:6px;align-items:center}
.saved .ic{width:14px;color:var(--mint)}
.sheet{flex:1;overflow:auto;background:#FBF8F2;border:2px solid var(--ink);border-radius:0 16px 0 0;padding:20px 34px 60px;min-height:0;box-shadow:6px 0 0 var(--blue-t)}
.sec{position:relative;padding:14px 0 16px;border-bottom:2px dotted #1D1B2E33}
.sec-head{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-num{font:700 12px var(--m);opacity:.5}
.sec-name{margin:0;font:800 19px/1 var(--g);font-stretch:80%;text-transform:uppercase;padding:5px 12px 4px;background:var(--paper-2);transform:rotate(-1.5deg);box-shadow:2px 2px 0 var(--ink);border:2px solid var(--ink)}
.sec[data-name="verse"] .sec-name{background:var(--mint)}
.sec[data-name="chorus"] .sec-name{background:var(--pink);color:#fff}
.sec[data-name="interlude"] .sec-name{background:var(--orange)}
.sec-time{font:400 11px var(--m);opacity:.55}
.sec-tools{margin-left:auto;display:flex;gap:4px;opacity:0;transition:.15s}
.sec:hover .sec-tools,.sec.now .sec-tools{opacity:1}
.sec-tools button{display:flex;gap:5px;align-items:center;padding:4px 10px;border:2px solid var(--ink);border-radius:999px;font:700 11px var(--m)}
.sec-tools .ic{width:12px}
.sec.now::before{content:'NOW PLAYING';position:absolute;right:-22px;top:18px;writing-mode:vertical-rl;font:700 10px var(--m);letter-spacing:.2em;color:var(--pink)}
.row{margin:4px 0 8px}
.bars{display:flex;flex-wrap:wrap;row-gap:14px;align-items:flex-start}
.bar{display:flex;gap:18px;padding:0 20px 0 14px;border-left:3px solid var(--blue);min-height:40px;position:relative}
.tail{display:flex;align-items:flex-start}
.bar.last{border-right:3px solid var(--blue)}
.row:not(.has-lyrics) .bar{min-width:140px}
.pass-labels{display:none;flex-direction:column;padding-top:42px;margin-left:-6px}
.bar.line-start .pass-labels{display:flex}
.pass-labels span{font:700 10px/24px var(--m);color:var(--blue);opacity:.7}
.chunk{display:flex;flex-direction:column;min-width:2.4em}
.chord{font:800 28px/1 var(--g);font-stretch:85%;letter-spacing:-.01em;text-align:left;padding:2px 6px 3px;margin:0 0 6px -6px;align-self:flex-start;border-radius:6px;position:relative;
  text-shadow:1.5px 1px 0 var(--pink-t)}
.chord .q{font-size:.6em;vertical-align:.45em;margin-left:1px}
.chord:hover{background:var(--paper-2)}
.chord.selected{background:var(--ink);color:var(--yellow);text-shadow:none}
.lyr{font:500 17px/24px var(--g);white-space:nowrap}
.repeat{font:800 18px/40px var(--g);color:#fff;background:var(--blue);padding:0 9px;height:30px;line-height:30px;border-radius:999px;margin:5px 0 0 10px;transform:rotate(-4deg)}
.chunk.now .chord{background:linear-gradient(100deg,transparent 2%,var(--yellow) 6%,var(--yellow) 92%,transparent 98%);text-shadow:none}
.chunk.now .chord::after{content:'';position:absolute;left:-4px;right:-4px;bottom:-4px;height:3px;background:var(--pink);border-radius:2px}
.row[data-cur] .lyr,.row[data-cur] .pass-labels span{opacity:.33}
.row[data-cur="0"] [data-pass="0"],.row[data-cur="1"] [data-pass="1"]{opacity:1!important}
.chunk.now .lyr{color:var(--pink)}

/* Sticker sheet stems */
.stickers{display:flex;flex-direction:column;min-height:0}
.stickers h2{margin:2px 0 10px;font:800 22px/1 var(--g);font-stretch:80%;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.stickers h2 small{font:400 11px var(--m);text-transform:none;opacity:.6;margin-left:auto}
.stem-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:auto;padding:4px 6px 20px 2px}
.stem{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-template-areas:"icon name name name" "fader fader fader fader" "mute mute solo solo";gap:8px;padding:12px;border:2px solid var(--ink);border-radius:16px;background:var(--c,var(--paper));box-shadow:3px 3px 0 var(--ink);overflow:hidden}
.stem:nth-child(1){--c:#FFC4E1}.stem:nth-child(2){--c:#FFD9B8}.stem:nth-child(3){--c:#FFF0A3}.stem:nth-child(4){--c:#B9EBDA}.stem:nth-child(5){--c:#C6D3FA}.stem:nth-child(6){--c:#E3D1F7}.stem:nth-child(7){--c:#E6E0D3}
.stem:nth-child(7){grid-column:span 2;grid-template-columns:repeat(8,1fr);grid-template-areas:"icon name name name fader fader fader fader" "mute mute solo solo fader fader fader fader"}
.stem-icon{grid-area:icon;width:36px;height:36px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);display:grid;place-items:center}
.stem-icon .ic{width:18px;height:18px}
.stem-name{grid-area:name;font:800 15px/1.05 var(--g);font-stretch:85%;align-self:center}
.meter{position:absolute;left:0;bottom:0;top:0;width:calc(var(--lvl,0)*100%);background:radial-gradient(#1D1B2E30 1.2px,transparent 1.4px);background-size:5px 5px;pointer-events:none;transition:width .05s}
.fader{grid-area:fader;width:100%;accent-color:var(--ink);position:relative}
.mute,.solo{position:relative;height:28px;border:2px solid var(--ink);border-radius:999px;display:grid;place-items:center;background:var(--paper)}
.mute{grid-area:mute}.solo{grid-area:solo}
.mute .ic,.solo .ic{width:15px}
.stem.muted{filter:grayscale(1);opacity:.6;box-shadow:none;transform:translate(2px,2px)}
.stem.muted .mute{background:var(--ink);color:var(--paper)}
.stem.soloed{box-shadow:4px 4px 0 var(--pink)}.stem.soloed .solo{background:var(--pink);color:#fff}
.master{display:flex;align-items:center;gap:10px;margin-top:4px;padding:10px 12px;border:2px solid var(--ink);border-radius:14px;background:#FBF8F2}
.master input{flex:1;accent-color:var(--pink)}
.master b{font:700 11px var(--m);text-transform:uppercase}

/* pop */
.pop{position:absolute;z-index:50;width:310px;background:#FBF8F2;border:2px solid var(--ink);border-radius:16px;padding:14px;box-shadow:6px 6px 0 var(--blue);font-family:var(--g)}
.pop-title{display:flex;gap:6px;align-items:center;font:700 11px var(--m);text-transform:uppercase}
.pop-title .ic{width:14px}
.pop-input{margin:10px 0;padding:6px 12px;border:2px solid var(--ink);border-radius:10px;font:800 32px/1 var(--g);font-stretch:85%;background:var(--yellow);display:flex;align-items:center}
.pop-input .q{font-size:.6em}
.caret{width:3px;height:28px;background:var(--pink);margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pop-sugs{display:flex;gap:6px;flex-wrap:wrap}
.pop-sugs button{padding:4px 10px;border:2px solid var(--ink);border-radius:999px;font-weight:800}
.pop-sugs button:hover{background:var(--mint)}
.pop-scope{display:flex;gap:6px;margin:12px 0}
.pop-scope button{flex:1;padding:6px;border:2px dashed var(--ink);border-radius:10px;font:700 11px var(--m);display:flex;gap:4px;align-items:center;justify-content:center;white-space:nowrap}
.pop-scope .ic{width:12px}
.pop-scope button.on{border-style:solid;background:var(--ink);color:var(--yellow)}
.pop-foot{display:flex;justify-content:space-between}
.pop-foot button{display:flex;gap:6px;align-items:center;padding:7px 12px;border:2px solid var(--ink);border-radius:10px;font-weight:800}
.pop-foot .ic{width:13px}
.pop-done{background:var(--pink);color:#fff}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><span>Chord</span><span>Buddy!</span></div>
    <div class="shelf">
      <div class="setlists"><span data-render="setlists" style="display:flex;gap:6px"></span><button class="add-set" title="New set list"><span data-icon="plus"></span></button></div>
      <div class="cards" data-render="songs"></div>
    </div>
    <div class="top-actions">
      <button class="btn hot"><span data-icon="upload"></span>Drop in an MP3</button>
      <div class="mini"><button title="Search"><span data-icon="search"></span></button><button title="Analyze again"><span data-icon="sparkle"></span></button><button title="Folder"><span data-icon="folder"></span></button><button title="Settings"><span data-icon="gear"></span></button></div>
    </div>
  </header>

  <section class="ticket">
    <div><h1 data-bind="title"></h1><div class="meta"><b>KEY D</b> · 120 BPM · 4/4<br><span data-bind="time"></span> / <span data-bind="total"></span> · <span data-bind="bar"></span></div></div>
    <div class="play-zone">
      <button class="round" data-action="loop" title="Loop section"><span data-icon="loop"></span></button>
      <button class="round" data-action="rew" title="Previous section"><span data-icon="rewind"></span></button>
      <button class="round big" data-action="play"></button>
      <button class="round" data-action="ffwd" title="Next section"><span data-icon="ffwd"></span></button>
      <button class="pill" data-action="slow" title="Practice speed"><span data-icon="turtle"></span><span data-bind="rate">100%</span></button>
    </div>
    <div class="lane" data-seek>
      <div class="blocks" data-render="blocks"></div>
      <div class="wave" data-render="wave" data-bars="150" data-round="true"></div>
      <div class="head"></div>
    </div>
    <div class="stub"><small>now</small><div class="now" data-bind="chord"></div><small>next → <span data-bind="next"></span> · <span data-bind="pass"></span></small>
      <div class="src"><button data-source>Original</button><button data-source class="active">Stems</button></div></div>
  </section>

  <section class="body">
    <div class="paper">
      <div class="tabs" data-tabs>
        <button class="tab active" data-tab="chart"><span data-icon="chart"></span>Chord chart</button>
        <button class="tab" data-tab="score"><span data-icon="score"></span>Lead sheet</button>
        <button class="tab" data-tab="midi"><span data-icon="midi"></span>MIDI</button>
        <span class="saved"><span data-icon="check"></span>saved just now</span>
        <div class="mini"><button title="Undo"><span data-icon="undo"></span></button><button title="Redo"><span data-icon="redo"></span></button><button title="Download"><span data-icon="download"></span></button></div>
      </div>
      <div class="sheet" data-autoscroll data-view="chart"><div data-render="chart"></div></div>
      <div class="sheet" data-view="score" hidden><p style="font-family:var(--m)">Lead sheet prints here.</p></div>
      <div class="sheet" data-view="midi" hidden><p style="font-family:var(--m)">MIDI editor here.</p></div>
    </div>
    <aside class="stickers">
      <h2><span data-icon="layers"></span>Stem stickers <small>mute · solo · mix</small></h2>
      <div class="stem-grid" data-render="stems"></div>
      <div class="master"><span data-icon="volume"></span><input type="range" value="80" aria-label="Master volume"><b>Master</b></div>
    </aside>
  </section>
</div>
<script src="mockup-core.js"></script>
</body>
</html>
