<!doctype html>
<html lang="en" data-theme="plum" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The title stays as it was: OBS's Application Audio Capture finds this window again by its title. -->
<title>Chord Buddy sound for OBS</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/press-room.base.css">
<link rel="stylesheet" href="/dark.css">
<link rel="stylesheet" href="/mixer-rack.css">
<link rel="stylesheet" href="/visualizer.css">
<link rel="stylesheet" href="/ui-kit.css">
<script type="module" src="/stream-controls.js"></script>
</head>
<body class="stream-controls-page">
<!-- Stream controls: the visualizer's picker for what OBS shows, since a Browser Source has no controls of its own. Nothing is
     drawn here (visual-stage.js), so the look is only drawn once, in OBS.
     In the desktop app this window is also how OBS hears Chord Buddy: OBS's Application Audio Capture can only pick a window, and it
     listens to the program that owns it. The main window belongs to Python, which OBS hears nothing from. This window belongs to the same
     WebView2 that plays the sound, so choosing it lets OBS hear Chord Buddy. -->
<header class="stream-controls-head">
  <h1><span data-icon="eye"></span>Stream controls</h1>
  <details id="stream-sound" class="stream-sound" open hidden>
    <summary title="Show or hide how this window gets Chord Buddy's sound into OBS"><span data-icon="volume"></span><span>Sound for OBS</span><span class="stream-sound-fold" data-icon="chevronDown"></span></summary>
    <p>This window also lets OBS hear Chord Buddy: in OBS, add an Application Audio Capture source and pick it. Keep it open while you stream (you can minimize it). It comes back each time Chord Buddy starts, until you close it.</p>
  </details>
</header>
<main id="stream-controls" class="visualizer-stage"></main>
<script src="/obs-sound.js"></script>
</body>
</html>
